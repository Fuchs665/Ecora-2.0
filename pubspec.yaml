name: ecora
description: A premium, cross-platform mobile application for the adult lifestyle community with extreme privacy.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  supabase_flutter: ^1.10.3
  provider: ^6.0.5
  local_auth: ^2.1.8
  image_picker: ^1.2.3
  http: ^1.6.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  url_launcher: ^6.3.0
  in_app_purchase: ^3.2.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
  fonts:
    # Bodoni Moda e Hanken Grotesk (licenza OFL, vedi assets/fonts/OFL-*.txt):
    # istanze statiche estratte dai font variabili di github.com/google/fonts.
    # Bodoni: wght 500, opsz 24 (titoli da 20 a 40px), solo corsivo.
    - family: EcoraDisplay
      fonts:
        - asset: assets/fonts/BodoniModa-MediumItalic.ttf
          weight: 500
          style: italic
    - family: EcoraUI
      fonts:
        - asset: assets/fonts/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk-Bold.ttf
          weight: 700

# sign_in_with_apple e' una dipendenza transitiva di supabase_flutter 1.x
# (mai usata: l'app non offre login Apple), fissata da supabase_flutter a
# <6.0.0. Le versioni <6.0.0 falliscono la build Android su Flutter/Kotlin
# recenti (API v1-embedding "Registrar" rimossa). Forziamo l'ultima 6.x,
# che ha migrato al setup Gradle moderno, senza toccare supabase_flutter.
dependency_overrides:
  sign_in_with_apple: ^6.1.4
