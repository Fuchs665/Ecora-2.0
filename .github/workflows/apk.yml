# ============================================================================
# Blocco CI.1: APK di prova compilato da GitHub (gratuito, entro i minuti
# inclusi di GitHub Actions). A ogni push sul branch di lavoro, o a mano da
# Actions -> "APK di prova" -> Run workflow:
#   1. flutter analyze e flutter test (se falliscono, niente APK);
#   2. APK release firmato con una chiave di prova (non quella del Play
#      Store), scaricabile dalla pagina dell'esecuzione, sezione Artifacts.
#
# Notifiche push: servono i dati Firebase. Aggiungere una volta il secret
# del repository GOOGLE_SERVICES_JSON (Settings -> Secrets and variables ->
# Actions) con il contenuto di android/app/google-services.json. Senza il
# secret l'APK si compila lo stesso, ma senza push.
#
# Chiave di firma: per installare un APK nuovo sopra quello vecchio la firma
# deve essere la stessa. La chiave di prova si crea alla prima esecuzione e
# si conserva nella cache di GitHub; se la cache scade (7 giorni senza
# esecuzioni) se ne crea un'altra e l'app va disinstallata una volta.
# ============================================================================
name: APK di prova

on:
  push:
    branches: [claude/peaceful-cori-q5pzdt]
    # Le modifiche ai soli documenti non cambiano l'APK.
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Dipendenze
        run: flutter pub get

      - name: Analisi
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Chiave di prova dalla cache
        id: keystore
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ecora-chiave-di-prova-v1

      - name: Chiave di prova nuova (solo se la cache non c'è)
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Salva la chiave di prova
        if: steps.keystore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: ecora-chiave-di-prova-v1

      - name: Dati Firebase per le push (se c'è il secret)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "PUSH=attive" >> "$GITHUB_ENV"
          else
            echo "PUSH=assenti (manca il secret GOOGLE_SERVICES_JSON)" >> "$GITHUB_ENV"
          fi

      - name: APK
        # Il numero di build cresce a ogni esecuzione: il telefono accetta
        # l'aggiornamento sopra la versione installata.
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Nome del file
        run: |
          short=$(git rev-parse --short HEAD)
          mv build/app/outputs/flutter-apk/app-release.apk \
             "ecora-${{ github.run_number }}-${short}.apk"
          {
            echo "### APK di prova ${{ github.run_number }} (${short})"
            echo "Notifiche push: ${PUSH}"
            echo "Scaricalo da Artifacts qui sotto, estrai lo zip e installa l'APK."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ecora-apk-${{ github.run_number }}
          path: ecora-*.apk
          retention-days: 14
